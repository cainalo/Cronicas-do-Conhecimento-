name: QA visual — Crônicas do Conhecimento

on:
  push:
    branches:
      - 'codex/qa-visual-audit-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários e de fluxo
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificação de layout existente
        run: npm run test:e2e
      - name: Auditoria visual por rota
        run: npm run test:visual
      - name: Guardar screenshots e relatório (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cronicas-auditoria-visual-${{ github.sha }}
          path: artifacts/visual-audit/
          if-no-files-found: warn
          retention-days: 14
