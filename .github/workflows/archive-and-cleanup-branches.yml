name: Arquivar e limpar branches antigas

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Confirmo arquivar e excluir todas as branches de desenvolvimento, mantendo main e gh-pages."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive-and-delete:
    if: ${{ inputs.confirm_cleanup }}
    runs-on: ubuntu-latest
    steps:
      - name: Arquivar commits e remover branches antigas
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = new Set(['main', 'gh-pages']);
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const archived = [];
            const failures = [];

            for (const branch of branches) {
              if (keep.has(branch.name)) continue;

              const snapshot = branch.commit.sha;
              const suffix = snapshot.slice(0, 12);
              const tagName = `archive/branches/${branch.name}/${suffix}`;
              const tagRef = `tags/${tagName}`;

              try {
                let existing;
                try {
                  existing = await github.rest.git.getRef({ owner, repo, ref: tagRef });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }

                if (existing && existing.data.object.sha !== snapshot) {
                  throw new Error(`A tag ${tagName} já existe apontando para outro commit.`);
                }

                if (!existing) {
                  await github.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/tags/${tagName}`,
                    sha: snapshot
                  });
                }

                const current = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });

                if (current.data.object.sha !== snapshot) {
                  failures.push(`${branch.name}: recebeu novos commits durante a limpeza; branch preservada.`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });

                archived.push({ branch: branch.name, tag: tagName, commit: snapshot });
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
              }
            }

            await core.summary
              .addHeading('Limpeza de branches')
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Tag de recuperação', header: true }, { data: 'Commit', header: true }],
                ...archived.map(item => [item.branch, item.tag, item.commit.slice(0, 12)])
              ])
              .addList([
                'main foi mantida como única branch de desenvolvimento.',
                'gh-pages foi mantida porque recebe os arquivos publicados do site.',
                'Os commits arquivados continuam recuperáveis pelas tags archive/branches/.'
              ])
              .write();

            for (const failure of failures) core.error(failure);
            if (failures.length) core.setFailed(`${failures.length} branch(es) não puderam ser removidas. Consulte o resumo.`);
            else core.info(`${archived.length} branch(es) arquivadas e removidas com sucesso.`);
